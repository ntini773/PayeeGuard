[workspace]
name = "payout-rescue"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

[pypi-dependencies]
langchain-nvidia-ai-endpoints = "==1.4.3"

[tasks]
test = "python -m unittest discover -s tests -v"
probe = "python -m rescue.cli"
diagnose-ai = "python -m rescue.ai"
